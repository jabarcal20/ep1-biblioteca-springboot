name: Deploy Produccion

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RUTA: /home/ubuntu/Deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar el código
      - name: Clonar repositorio
        uses: actions/checkout@v4


      # 2. Configurar Java 21 en GitHub Actions
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # 3. Compilar proyecto
      - name: Compilar proyecto
        run: |
          cd Biblioteca-Springboot
          mvn clean install -DskipTests

      # 4. Copiar Eureka a AWS
      - name: Copiar Eureka
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "Biblioteca-Springboot/eureka/target/cl-triskeledu-eureka-1.0-SNAPSHOT.jar"
          target: "/home/ubuntu/Deploy"
          strip_components: 3

      # 5. Preparar y ejecutar Eureka
      - name: Preparar y ejecutar Eureka
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/ubuntu/Deploy

            echo "Deteniendo Eureka anterior..."

            if [ -f eureka.pid ]; then
              PID=$(cat eureka.pid)

              if kill -0 "$PID" 2>/dev/null; then
                echo "Deteniendo Eureka con PID $PID..."
                kill "$PID"
                sleep 5
              else
                echo "El proceso anterior ya no está ejecutándose."
              fi

              rm -f eureka.pid
            else
              echo "No existe un proceso anterior de Eureka."
            fi

            echo "Iniciando Eureka..."

            nohup java -jar cl-triskeledu-eureka-1.0-SNAPSHOT.jar \
              --spring.profiles.active=prod \
              > eureka.log 2>&1 &

            echo $! > eureka.pid

            echo "Esperando que Eureka inicie..."
            sleep 10

            if kill -0 "$(cat eureka.pid)" 2>/dev/null; then
              echo "Eureka está ejecutándose correctamente."
            else
              echo "ERROR: Eureka no pudo iniciarse."
              echo "Mostrando últimos logs:"
              tail -n 50 eureka.log
              exit 1
            fi


      # 6. Copiar ms-usuarios a AWS
      - name: Copiar ms-usuarios
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "Biblioteca-Springboot/ms-usuarios/target/cl-triskeledu-usuarios-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/Deploy"
          strip_components: 3


      # 7. Preparar y ejecutar ms-usuarios en AWS
      - name: Preparar y ejecutar ms-usuarios
        uses: appleboy/ssh-action@v1.2.2

        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EUREKA_URL: http://localhost:8761/eureka

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}

          envs: DB_URL,DB_USERNAME,DB_PASSWORD,EUREKA_URL

          script: |

            # ==========================================
            # Ir a la carpeta de producción
            # ==========================================

            cd /home/ubuntu/Deploy


            # ==========================================
            # Comprobar Java 21
            # ==========================================

            echo "Comprobando Java..."

            if java -version 2>&1 | grep -q '"21'; then

              echo "Java 21 ya está instalado."

            else

              echo "Java 21 no está instalado."
              echo "Instalando Java 21..."

              sudo apt update
              sudo apt install -y openjdk-21-jdk

              echo "Java 21 instalado."

            fi


            # Mostrar versión de Java
            echo "Versión de Java instalada:"
            java -version


            # ==========================================
            # Detener versión anterior
            # ==========================================

            echo "Deteniendo versión anterior..."

            if [ -f ms-usuarios.pid ]; then

              PID=$(cat ms-usuarios.pid)

              if kill -0 "$PID" 2>/dev/null; then

                echo "Deteniendo proceso anterior con PID $PID..."

                kill "$PID"

                sleep 5

              else

                echo "El proceso anterior ya no está ejecutándose."

              fi

              rm -f ms-usuarios.pid

            else

              echo "No existe un proceso anterior."

            fi


            # ==========================================
            # Variables de base de datos
            # ==========================================

            export DB_URL="$DB_URL"
            export DB_USERNAME="$DB_USERNAME"
            export DB_PASSWORD="$DB_PASSWORD"
            export EUREKA_URL="$EUREKA_URL"


            # ==========================================
            # Iniciar ms-usuarios
            # ==========================================

            echo "Iniciando ms-usuarios..."

            nohup java -jar cl-triskeledu-usuarios-0.0.1-SNAPSHOT.jar \
              --spring.profiles.active=prod \
              > ms-usuarios.log 2>&1 &

            echo $! > ms-usuarios.pid


            # ==========================================
            # Comprobar que la aplicación sigue ejecutándose
            # ==========================================

            echo "Esperando que Spring Boot inicie..."

            sleep 10

            if kill -0 "$(cat ms-usuarios.pid)" 2>/dev/null; then

              echo "ms-usuarios está ejecutándose correctamente."

            else

              echo "ERROR: ms-usuarios no pudo iniciarse."

              echo "Mostrando últimos logs:"

              tail -n 50 ms-usuarios.log

              exit 1

            fi
      # 8. Copiar ms-catalogo a AWS
      - name: Copiar ms-catalogo
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "Biblioteca-Springboot/ms-catalogo/target/cl-triskeledu-catalogo-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/Deploy"
          strip_components: 3


      # 9. Preparar y ejecutar ms-catalogo
      - name: Preparar y ejecutar ms-catalogo
        uses: appleboy/ssh-action@v1.2.2
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD
          script: |
            cd /home/ubuntu/Deploy

            echo "Deteniendo ms-catalogo anterior..."

            if [ -f ms-catalogo.pid ]; then
              PID=$(cat ms-catalogo.pid)

              if kill -0 "$PID" 2>/dev/null; then
                echo "Deteniendo proceso anterior con PID $PID..."
                kill "$PID"
                sleep 5
              else
                echo "El proceso anterior ya no está ejecutándose."
              fi

              rm -f ms-catalogo.pid
            else
              echo "No existe un proceso anterior."
            fi

            export DB_URL="$DB_URL"
            export DB_USERNAME="$DB_USERNAME"
            export DB_PASSWORD="$DB_PASSWORD"

            export EUREKA_URL="http://localhost:8761/eureka"

            echo "Iniciando ms-catalogo..."

            nohup java -jar cl-triskeledu-catalogo-0.0.1-SNAPSHOT.jar \
              --spring.profiles.active=prod \
              > ms-catalogo.log 2>&1 &

            echo $! > ms-catalogo.pid

            echo "Esperando que Spring Boot inicie..."
            sleep 10

            if kill -0 "$(cat ms-catalogo.pid)" 2>/dev/null; then
              echo "ms-catalogo está ejecutándose correctamente."
            else
              echo "ERROR: ms-catalogo no pudo iniciarse."
              echo "Mostrando últimos logs:"
              tail -n 50 ms-catalogo.log
              exit 1
            fi

        # 10. Copiar ms-recursos a AWS
      - name: Copiar ms-recursos
        uses: appleboy/scp-action@v0.1.7
        with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USER }}
            key: ${{ secrets.SSH_KEY }}
            port: ${{ secrets.SSH_PORT }}
            source: "Biblioteca-Springboot/ms-recursos/target/cl-triskeledu-recursos-0.0.1-SNAPSHOT.jar"
            target: "/home/ubuntu/Deploy"
            strip_components: 3
      
            # 11. Preparar y ejecutar ms-recursos
      - name: Preparar y ejecutar ms-recursos
        uses: appleboy/ssh-action@v1.2.2
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EUREKA_URL: http://localhost:8761/eureka
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,EUREKA_URL
          script: |
            cd /home/ubuntu/Deploy

            echo "Deteniendo ms-recursos anterior..."

            if [ -f ms-recursos.pid ]; then
              PID=$(cat ms-recursos.pid)

              if kill -0 "$PID" 2>/dev/null; then
                echo "Deteniendo proceso anterior con PID $PID..."
                kill "$PID"
                sleep 5
              else
                echo "El proceso anterior ya no está ejecutándose."
              fi

              rm -f ms-recursos.pid
            else
              echo "No existe un proceso anterior."
            fi

            export DB_URL="$DB_URL"
            export DB_USERNAME="$DB_USERNAME"
            export DB_PASSWORD="$DB_PASSWORD"
            export EUREKA_URL="$EUREKA_URL"

            echo "Iniciando ms-recursos..."

            nohup java -jar cl-triskeledu-recursos-0.0.1-SNAPSHOT.jar \
              --spring.profiles.active=prod \
              > ms-recursos.log 2>&1 &

            echo $! > ms-recursos.pid

            echo "Esperando que Spring Boot inicie..."
            sleep 10

            if kill -0 "$(cat ms-recursos.pid)" 2>/dev/null; then
              echo "ms-recursos está ejecutándose correctamente."
            else
              echo "ERROR: ms-recursos no pudo iniciarse."
              echo "Mostrando últimos logs:"
              tail -n 50 ms-recursos.log
              exit 1
            fi


            
      # 12. Copiar API Gateway
      - name: Copiar API Gateway
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "Biblioteca-Springboot/api-gateway/target/cl-triskeledu-gateway-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/Deploy"
          strip_components: 3

      # 13. Preparar y ejecutar API Gateway
      - name: Preparar y ejecutar API Gateway
        uses: appleboy/ssh-action@v1.2.2
        env:
          EUREKA_URL: http://localhost:8761/eureka
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: EUREKA_URL
          script: |
            cd /home/ubuntu/Deploy

            echo "Deteniendo API Gateway anterior..."

            if [ -f api-gateway.pid ]; then
              PID=$(cat api-gateway.pid)

              if kill -0 "$PID" 2>/dev/null; then
                echo "Deteniendo API Gateway con PID $PID..."
                kill "$PID"
                sleep 5
              else
                echo "El proceso anterior ya no está ejecutándose."
              fi

            rm -f api-gateway.pid
            else
              echo "No existe un proceso anterior de API Gateway."
            fi

            export EUREKA_URL="$EUREKA_URL"

            echo "Iniciando API Gateway..."

            nohup java -jar cl-triskeledu-gateway-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=prod \
            > api-gateway.log 2>&1 &

            echo $! > api-gateway.pid

            echo "Esperando que Spring Boot inicie..."
            leep 15

            if kill -0 "$(cat api-gateway.pid)" 2>/dev/null; then
              echo "API Gateway está ejecutándose correctamente."
            else
              echo "ERROR: API Gateway no pudo iniciarse."
              echo "Mostrando últimos logs:"
              tail -n 50 api-gateway.log
              exit 1
            fi




      